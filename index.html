<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домино</title>
<style>
:root{--felt:#1e5a3c;--felt2:#16452e;--tx:#f3efe0;--tile:#f5efdc;--ink:#1b1b1b;--brass:#e0b04a;--mute:#b9d3c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--felt:#123424;--felt2:#0c2419}}
:root[data-theme="dark"]{--felt:#123424;--felt2:#0c2419}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt2));color:var(--tx);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px;flex-wrap:wrap}
.sc{font-size:15px;line-height:1.3}.sc b{font-size:20px;color:var(--brass)}
.bt{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;background:var(--brass);color:#2a2000;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
button.g{background:transparent;color:var(--tx);border:1px solid #fff5}
button.g.on{border-color:var(--brass);color:var(--brass)}
button:focus-visible,.t.ok:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opp{display:flex;gap:10px;justify-content:center;padding:4px 8px;min-height:60px;align-items:flex-start}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--mute);flex:1;max-width:33%}
.grp.act{color:var(--brass)}
.row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.b{width:18px;height:34px;border-radius:3px;background:repeating-linear-gradient(45deg,#b8892f,#b8892f 3px,#9a7022 3px,#9a7022 6px);box-shadow:0 2px 0 #0005}
.row .t{--s:18px}
.board{flex:1;overflow-x:auto;display:flex;min-height:140px}
.chain{display:flex;align-items:center;margin:auto;padding:0 20px;gap:2px;--s:40px}
#msg{text-align:center;padding:8px 14px;min-height:44px;font-size:17px}
.ctl{display:flex;gap:10px;justify-content:center;min-height:50px;padding:0 10px}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 10px 16px;--s:clamp(36px,10.5vw,52px)}
.t{display:flex;align-items:center;justify-content:center;background:var(--tile);border-radius:7px;border:1px solid #0003;box-shadow:0 2px 0 #0005,0 4px 8px #0004;flex:none;padding:2px}
.t.v{flex-direction:column}
.t i{width:2px;height:70%;background:#0004;border-radius:1px}
.t.v i{width:70%;height:2px}
.h{width:var(--s);height:var(--s);display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:15%}
.h span.p{background:var(--ink);border-radius:50%;margin:8%}
.hand .t{transition:transform .12s}
.hand .t.ok{cursor:pointer;box-shadow:0 0 0 2px var(--brass),0 4px 8px #0004}
.hand .t.sel{transform:translateY(-10px)}
.hand .t:not(.ok){opacity:.75}
@keyframes drop{from{transform:translate(var(--dx),var(--dy)) rotate(-22deg) scale(1.4);opacity:0}55%{opacity:1}80%{transform:scale(.96)}to{transform:none}}
.chain .t.new{animation:drop .55s cubic-bezier(.2,.8,.25,1)}
@media(prefers-reduced-motion:reduce){.hand .t{transition:none}.chain .t.new{animation:none}}
</style></head><body>
<header>
 <div class="sc"><span id="n1">Вы</span> <b id="s1">0</b> : <b id="s2">0</b> <span id="n2">Компьютер</span><br><small id="yd" style="color:var(--mute)"></small></div>
 <div class="bt"><button class="g" id="m2" onclick="setMode(2)">Классика 1×1</button><button class="g" id="m4" onclick="setMode(4)">Козёл 2×2</button><button class="g" id="mu" onclick="toggleMute()" aria-label="Звук">🔊</button><button class="g" onclick="newGame(true)">Заново</button></div>
</header>
<div class="opp" id="opp"></div>
<div class="board" id="board"><div class="chain" id="chain"></div></div>
<div id="msg"></div>
<div class="ctl" id="ctl"></div>
<div class="hand" id="hand"></div>
<script>
const P={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const $=id=>document.getElementById(id);
const ALL=[];for(let a=0;a<7;a++)for(let b=a;b<7;b++)ALL.push([a,b]);
const kk=t=>t[0]<t[1]?t[0]+','+t[1]:t[1]+','+t[0];
let mode=2,N=2,H,yard,chain,turn,passes,over,sel,lacks,score={a:0,b:0},last,lastSeat,matchOver=false,NAMES;
const sum=h=>h.reduce((s,t)=>s+t[0]+t[1],0);
const ends=()=>[chain[0][0],chain[chain.length-1][1]];
function half(n){const h=document.createElement('div');h.className='h';for(let i=0;i<9;i++){const s=document.createElement('span');if(P[n].includes(i))s.className='p';h.appendChild(s)}return h}
function tile(t,vert){const d=document.createElement('div');d.className='t'+(vert?' v':'');d.append(half(t[0]),document.createElement('i'),half(t[1]));return d}
function msg(t){$('msg').textContent=t}
let AC,muted=false;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC}
addEventListener('pointerdown',ac);
function toggleMute(){muted=!muted;$('mu').textContent=muted?'🔇':'🔊'}
function tone(f,d,v,ty,w){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,w);g.gain.exponentialRampToValueAtTime(.001,w+d);o.connect(g);g.connect(AC.destination);o.start(w);o.stop(w+d)}
function snd(k){if(muted||!ac())return;const t=AC.currentTime;
 if(k=='clack'){const n=AC.sampleRate*.05|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=2200;g.gain.value=.9;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);tone(150,.09,.5,'sine',t)}
 else if(k=='draw'){tone(320,.07,.2,'triangle',t);tone(260,.07,.2,'triangle',t+.07)}
 else if(k=='pass'){tone(200,.15,.2,'sine',t);tone(150,.22,.2,'sine',t+.12)}
 else if(k=='win')[523,659,784,1047].forEach((f,i)=>tone(f,.3,.25,'triangle',t+i*.12))
 else if(k=='lose')[392,330,262].forEach((f,i)=>tone(f,.35,.25,'triangle',t+i*.16))}
function moves(h){const [L,R]=ends(),m=[];h.forEach((t,i)=>{if(t.includes(L))m.push({i,side:'L'});if(t.includes(R))m.push({i,side:'R'})});return m}
function place(p,i,side){const t=H[p].splice(i,1)[0],[L,R]=ends();
 const o=side=='L'?(t[1]==L?t:[t[1],t[0]]):(t[0]==R?t:[t[1],t[0]]);
 side=='L'?chain.unshift(o):chain.push(o);last=o;lastSeat=p;setTimeout(()=>snd('clack'),380)}
function lack(p){const [L,R]=ends();lacks[p].add(L);lacks[p].add(R)}
function setMode(m){mode=m;score={a:0,b:0};newGame()}
function newGame(reset){
 if(reset===true||matchOver){score={a:0,b:0};matchOver=false}
 N=mode;NAMES=N==4?['Вы','Слева','Партнёр','Справа']:['Вы','Компьютер'];
 const all=ALL.map(t=>[...t]);
 for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]]}
 H=[];for(let p=0;p<N;p++)H.push(all.splice(0,7));
 yard=N==2?all:[];chain=[];passes=0;over=false;sel=-1;lacks=H.map(()=>new Set());
 const key=t=>N==4?(t[0]==1&&t[1]==1?1:0):(t[0]==t[1]?100+t[0]:t[0]+t[1]);
 let bp=0,bi=0,bk=-1;H.forEach((h,p)=>h.forEach((t,i)=>{if(key(t)>bk){bk=key(t);bp=p;bi=i}}));
 const f=H[bp].splice(bi,1)[0];chain.push(f);last=f;lastSeat=bp;turn=(bp+1)%N;
 $('m2').classList.toggle('on',N==2);$('m4').classList.toggle('on',N==4);
 next(NAMES[bp]+(bp?' начинает':' начинаете')+' с '+f[0]+'–'+f[1]);
}
function next(note){
 sel=-1;
 for(let p=0;p<N;p++)if(!H[p].length)return end(p);
 if(passes>=N)return end(-1);
 render();
 if(turn){msg((note?note+' · ':'')+NAMES[turn]+' думает…');setTimeout(cpuMove,850)}
 else if(!moves(H[0]).length)msg(yard.length?'Нет подходящих костей — возьмите из базара':'Нет ходов — пропустите ход');
 else msg((note?note+'. ':'')+'Ваш ход');
}
function choose(p,m){
 const h=H[p],[L,R]=ends(),seen=new Set([...chain,...h].map(kk)),un=ALL.filter(t=>!seen.has(kk(t)));
 const un_n=n=>un.filter(t=>t.includes(n)).length,opp=[],par=[];
 for(let q=0;q<N;q++)if(q!=p)(q%2==p%2?par:opp).push(q);
 let best=m[0],bs=-1e9;
 for(const mv of m){
  const t=h[mv.i],open=mv.side=='L'?L:R,oth=mv.side=='L'?R:L,nw=t[0]==open?t[1]:t[0];
  const rest=h.filter((_,j)=>j!=mv.i),cnt=n=>rest.filter(x=>x.includes(n)).length;
  let s=(t[0]+t[1])*(rest.length<3?1:.5)+(t[0]==t[1]?2:0)+(rest.length?0:100);
  [nw,oth].forEach((e,k)=>{const w=k?.6:1;s+=w*(1.2*cnt(e)-.5*un_n(e));
   opp.forEach(q=>{if(lacks[q].has(e))s+=w*4});par.forEach(q=>{if(lacks[q].has(e))s-=w*3})});
  s+=rest.filter(x=>x.includes(nw)||x.includes(oth)).length*1.5+Math.random()*.5;
  if(s>bs){bs=s;best=mv}}
 return best;
}
function cpuMove(){
 const p=turn,m=moves(H[p]);
 if(!m.length){
  lack(p);
  if(yard.length){H[p].push(yard.pop());snd('draw');render();msg(NAMES[p]+' берёт из базара');return setTimeout(cpuMove,650)}
  passes++;snd('pass');turn=(p+1)%N;return next(NAMES[p]+' пропускает ход');
 }
 const b=choose(p,m),t=H[p][b.i];place(p,b.i,b.side);passes=0;turn=(p+1)%N;next(NAMES[p]+' сходил '+t[0]+'–'+t[1]);
}
function tap(i){
 if(turn||over)return;
 const m=moves(H[0]).filter(x=>x.i==i);if(!m.length)return;
 const [L,R]=ends();
 if(m.length==1||L==R)go(i,m[m.length-1].side);else{sel=i;render()}
}
function go(i,side){place(0,i,side);passes=0;turn=1%N;next()}
function draw(){lack(0);H[0].push(yard.pop());snd('draw');next()}
function pass(){lack(0);passes++;snd('pass');turn=1%N;next()}
function end(w){
 over=true;let t,sc=[0,0];
 const ts=[0,1].map(tm=>H.reduce((s,h,p)=>p%2==tm?s+sum(h):s,0));
 if(w>=0){const tm=w%2;sc[tm]=ts[1-tm];
  t=(N==4?(tm?'Соперники выиграли раунд':'Ваша команда выиграла раунд'):(tm?'Компьютер выиграл':'Вы выиграли'))+': +'+ts[1-tm]}
 else if(ts[0]==ts[1])t='«Рыба»: ничья';
 else{const tm=ts[0]<ts[1]?0:1;sc[tm]=ts[1-tm]-ts[tm];
  t='«Рыба»: '+(tm?'победили соперники':'победили вы')+' ('+ts[tm]+' против '+ts[1-tm]+'), +'+sc[tm]}
 score.a+=sc[0];score.b+=sc[1];setTimeout(()=>snd(sc[0]>sc[1]?'win':sc[1]>sc[0]?'lose':'pass'),500);
 if(N==4&&(score.a>=101||score.b>=101)){matchOver=true;t+=' · Матч до 101 завершён!'}
 render();msg(t);
}
function render(){
 $('n1').textContent=N==4?'Мы':'Вы';$('n2').textContent=N==4?'Они':'Компьютер';
 $('s1').textContent=score.a;$('s2').textContent=score.b;
 $('yd').textContent=N==4?'Игра до 101 очка':'Базар: '+yard.length;
 const o=$('opp');o.replaceChildren();
 for(let p=1;p<N;p++){
  const g=document.createElement('div');g.className='grp'+(turn==p&&!over?' act':'');
  const l=document.createElement('div');l.textContent=NAMES[p]+' · '+H[p].length;
  const r=document.createElement('div');r.className='row';
  H[p].forEach(t=>{if(over)r.appendChild(tile(t,true));else{const b=document.createElement('div');b.className='b';r.appendChild(b)}});
  g.append(l,r);o.appendChild(g);
 }
 const c=$('chain');c.replaceChildren();
 const dirs=N==2?[[0,170],[0,-170]]:[[0,170],[-210,-10],[0,-170],[210,-10]];
 chain.forEach(t=>{const d=tile(t,t[0]==t[1]);
  if(t===last){d.classList.add('new');d.style.setProperty('--dx',dirs[lastSeat][0]+'px');d.style.setProperty('--dy',dirs[lastSeat][1]+'px')}
  c.appendChild(d)});
 const bd=$('board'),nw=c.querySelector('.new');bd.scrollLeft=(bd.scrollWidth-bd.clientWidth)/2;
 if(nw&&bd.scrollWidth>bd.clientWidth){const r=nw.getBoundingClientRect(),br=bd.getBoundingClientRect();bd.scrollLeft+=r.left+r.width/2-(br.left+bd.clientWidth/2)}
 const hd=$('hand');hd.replaceChildren();
 const ok=new Set(!turn&&!over?moves(H[0]).map(x=>x.i):[]);
 H[0].forEach((t,i)=>{const d=tile(t,true);
  if(ok.has(i)){d.classList.add('ok');d.tabIndex=0;d.onclick=()=>tap(i);d.onkeydown=e=>{if(e.key=='Enter'||e.key==' ')tap(i)}}
  if(i==sel)d.classList.add('sel');hd.appendChild(d)});
 const k=$('ctl');k.replaceChildren();
 const add=(txt,fn)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=fn;k.appendChild(b)};
 if(over)add(matchOver?'Новый матч':'Сыграть ещё',()=>newGame());
 else if(!turn){
  const [L,R]=ends();
  if(sel>=0){add('Слева ('+L+')',()=>go(sel,'L'));add('Справа ('+R+')',()=>go(sel,'R'))}
  else if(!moves(H[0]).length){if(yard.length)add('Взять из базара',draw);else add('Пропустить ход',pass)}
 }
}
newGame();
</script></body></html>
